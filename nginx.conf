server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a tunnel: never build an absolute redirect from this container's own
    # scheme and port, or visitors get sent to http://…:8080/.
    absolute_redirect off;
    port_in_redirect off;

    # The whole site is one page. Anything else is that page too, rather than a 404 --
    # the old site had /about, /blog, /projects and /contact, and links to them exist
    # in the wild. They now land on the homepage instead of an error.
    # Real files first. The fallback below is what makes old routes land on the
    # homepage, but it also silently served index.html for a missing image with a 200,
    # which looks identical to success unless you check the content type.
    location ~* \.(ico|png|jpg|jpeg|svg|webp|avif|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html inlines its assets as base64, which does not compress well on its own
    # but still sheds roughly a third over the wire.
    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
